name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.22 pyright==1.1.414
      - run: ruff check --line-length 120 core/.claude/hooks kit tests
      - run: pyright core/.claude/hooks kit
      - run: git config --global user.email ci@example.com && git config --global user.name ci && git config --global init.defaultBranch main
      - run: python3 -m unittest discover -s tests -v
